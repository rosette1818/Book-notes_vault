<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book & Notes Vault Tests</title>
</head>
<body>
  <h1>Book & Notes Vault - Automated Tests</h1>

  <ul id="test-results"></ul>

  <script src="scripts/validators.js"></script>
  <script>
  function runTest(description, condition) {
    const result = document.createElement("li");

    if (condition) {
      result.textContent = "PASS: " + description;
    } else {
      result.textContent = "FAIL: " + description;
    }

    document.getElementById("test-results").appendChild(result);
  }
  runTest("Rejects an empty title", validateTitle("") === false);
runTest("Rejects a whitespace-only title", validateTitle("   ") === false);
runTest("Accepts a valid title", validateTitle("Atomic Habits"));
runTest("Rejects an empty author", validateAuthor("") === false);
runTest("Rejects a whitespace-only author", validateAuthor("   ") === false);
runTest("Accepts a valid author", validateAuthor("Chinua Achebe"));
runTest("Rejects zero pages", validatePages(0) === false);
runTest("Rejects negative pages", validatePages(-10) === false);
runTest("Rejects letters as pages", validatePages("abc") === false);
runTest("Accepts a valid page count", validatePages(250));
runTest("Rejects an empty tag", validateTag("") === false);
runTest("Rejects invalid characters in a tag", validateTag("Science123") === false);
runTest("Accepts a valid tag", validateTag("Science Fiction"));
runTest("Rejects an empty date", validateDate("") === false);
runTest("Rejects an incorrect date format", validateDate("13-10-2026") === false);
runTest("Accepts a valid date format", validateDate("2026-10-13"));
runTest("Rejects an invalid month", validateDate("2026-15-10") === false);

runTest("Rejects an impossible day", validateDate("2026-02-30") === false);

runTest("Rejects February 29 in a non-leap year", validateDate("2025-02-29") === false);

runTest("Accepts February 29 in a leap year", validateDate("2024-02-29"));

runTest("Accepts a valid date at the end of a month", validateDate("2026-01-31"));
runTest("Detects repeated words", hasRepeatedWords("Math Math"));
runTest("Detects repeated words regardless of case", hasRepeatedWords("Book book"));
runTest("Accepts a title without repeated words", hasRepeatedWords("Atomic Habits") === false);
runTest("Does not detect non-adjacent repeated words", hasRepeatedWords("Math Science Math") === false);
runTest("Rejects decimal page counts", validatePages(10.5) === false);
runTest("Rejects page counts above 5000", validatePages(5001) === false);
runTest("Accepts the maximum page count", validatePages(5000));
runTest("Rejects a date with slashes", validateDate("2026/10/13") === false);
runTest("Rejects a date with missing digits", validateDate("2026-1-3") === false);
// Import validation tests

const validBook = {
  id: "test-001",
  title: "Atomic Habits",
  author: "James Clear",
  pages: 320,
  tag: "Self Help",
  dateAdded: "2026-10-13",
  createdAt: "2026-10-13T10:00:00.000Z",
  updatedAt: "2026-10-13T10:00:00.000Z"
};

runTest(
  "Rejects imported data that is not an array",
  validateImportedBooks({}) === false
);

runTest(
  "Accepts a valid imported book",
  validateImportedBooks([validBook])
);

runTest(
  "Rejects a book with a missing title",
  validateImportedBooks([{ ...validBook, title: undefined }]) === false
);

runTest(
  "Rejects a book with invalid pages",
  validateImportedBooks([{ ...validBook, pages: 0 }]) === false
);

runTest(
  "Rejects a book with a missing ID",
  validateImportedBooks([{ ...validBook, id: undefined }]) === false
);
</script>
</body>
</html>
